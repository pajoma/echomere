[package]
name = "scene-preview"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
cove-render = { path = "../cove-render" }
cove-scene = { path = "../cove-scene" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "gles", "wgsl"] }
