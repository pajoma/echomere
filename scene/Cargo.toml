[workspace]
resolver = "2"
members = ["cove-scene", "cove-swarm", "cove-render", "scene-preview"]

# The disk is small and software rendering in debug is slow: no debug info, dependencies optimised.
[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

# The fish simulation is tested over minutes of simulated time: optimised even in debug builds.
[profile.dev.package.cove-swarm]
opt-level = 3
